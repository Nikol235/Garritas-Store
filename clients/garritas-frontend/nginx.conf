server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy to gateway — works in Docker Compose where
  # garritas-gateway resolves.  On Railway the frontend talks
  # directly to the public gateway URL (set via GATEWAY_URL env var
  # in docker-entrypoint.sh) so this block is never hit.
  location /api/ {
    proxy_pass http://garritas-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
