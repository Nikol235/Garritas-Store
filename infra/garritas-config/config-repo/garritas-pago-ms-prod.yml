server:
  port: 8087
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:18180/realms/garritas}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:18180/realms/garritas/protocol/openid-connect/certs}
          audiences:
          - garritas-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 10000
        max.block.ms: 10000
    consumer:
      group-id: garritas-pago-ms-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://garritas-eureka:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
app:
  kafka:
    topic: garritas.ventas.v1
  pagos:
    metodo-rechazado: ${PAGO_METODO_RECHAZADO:TRANSFERENCIA}
    # true: sin Mercado Pago, aprueba/rechaza al instante (solo demos). false: queda PENDIENTE.
    simular: ${MP_SIMULAR_PAGOS:false}
  mercadopago:
    # auto: Checkout Pro si hay MP_ACCESS_TOKEN. MP_MODE=live solo con credenciales de producción.
    enabled: ${MP_CHECKOUT_ENABLED:auto}
    mode: ${MP_MODE:test}
    access-token: "${MP_ACCESS_TOKEN:}"
    back-url: ${MP_BACK_URL:https://garritas-frontend-production.up.railway.app}
    # URL pública HTTPS del gateway: https://<gateway>/api/v1/pagos/webhook
    notification-url: "${MP_NOTIFICATION_URL:}"
    webhook-secret: "${MP_WEBHOOK_SECRET:}"
